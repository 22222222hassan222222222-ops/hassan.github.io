<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كافيه الأصيل | تجربة قهوة مختلفة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background-color: #fcfaf8; color: #3e2723; line-height: 1.6; }
    
    /* الغلاف الرئيسي */
    .hero {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=1000&auto=format&fit=crop') center/cover;
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      padding: 20px;
    }
    .hero h1 { font-size: 40px; font-weight: 900; margin-bottom: 10px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
    .hero p { font-size: 18px; margin-bottom: 25px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
    .hero-btn { background: #d84315; color: #fff; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.3s; }
    .hero-btn:hover { background: #bf360c; transform: scale(1.05); }

    /* المنيو */
    .section-title { text-align: center; font-size: 28px; color: #3e2723; margin: 40px 0 20px; font-weight: 900; }
    .section-title span { color: #d84315; }
    
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 20px;
      max-width: 900px;
      margin: auto;
    }
    .menu-item {
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: transform 0.3s;
    }
    .menu-item:hover { transform: translateY(-5px); }
    .menu-img { width: 100%; height: 200px; object-fit: cover; }
    .menu-info { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .menu-info h3 { font-size: 18px; margin-bottom: 5px; }
    .menu-info p { font-size: 13px; color: #795548; }
    .price { font-weight: 900; color: #d84315; font-size: 20px; }

    /* زرار واتساب ثابت */
    .fixed-wa {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-decoration: none;
      z-index: 100;
      transition: 0.3s;
    }
    .fixed-wa:hover { transform: scale(1.1); }

    footer { text-align: center; padding: 20px; background: #3e2723; color: #fff; margin-top: 40px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- الغلاف -->
  <div class="hero">
    <h1>كافيه الأصيل ☕</h1>
    <p>أحلى قهوة وأجمل قعدة في مصر</p>
    <a href="#menu" class="hero-btn">اكتشف المنيو</a>
  </div>

  <!-- المنيو -->
  <h2 class="section-title">قائمة <span>المنيو</span></h2>
  
  <div class="menu-grid" id="menu">
    <!-- المشروب الأول -->
    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1559496417-e7f25cb247f3?q=80&w=500&auto=format&fit=crop" alt="قهوة تركي" class="menu-img">
      <div class="menu-info">
        <div>
          <h3>قهوة تركي</h3>
          <p>قهوة غامقة بطعم أصيل</p>
        </div>
        <div class="price">30 ج.م</div>
      </div>
    </div>

    <!-- المشروب التاني -->
    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?q=80&w=500&auto=format&fit=crop" alt="لاتيه بارد" class="menu-img">
      <div class="menu-info">
        <div>
          <h3>لاتيه بارد</h3>
          <p>حليب مع إسبريسو وثلج</p>
        </div>
        <div class="price">55 ج.م</div>
      </div>
    </div>

    <!-- الأكل -->
    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=500&auto=format&fit=crop" alt="كرواسون" class="menu-img">
      <div class="menu-info">
        <div>
          <h3>كرواسون شوكولاتة</h3>
          <p>مخبوز طازج كل يوم</p>
        </div>
        <div class="price">40 ج.م</div>
      </div>
    </div>
  </div>

  <!-- زرار واتساب ثابت -->
  <a href="https://wa.me/201119125487" class="fixed-wa" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <footer>
    © 2026 كافيه الأصيل - جميع الحقوق محفوظة
  </footer>

</body>
</html>
