<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كافيه الأصيل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background-color: #fff8f0; color: #3e2723; line-height: 1.6; }
    .header { background: #3e2723; color: #fff; text-align: center; padding: 40px 20px; border-bottom: 5px solid #d84315; }
    .header h1 { font-size: 32px; margin-bottom: 10px; }
    .header p { color: #ffccbc; font-size: 16px; }
    .menu-section { padding: 30px 20px; max-width: 600px; margin: auto; }
    .menu-section h2 { text-align: center; color: #d84315; margin-bottom: 20px; font-size: 24px; }
    .item { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-right: 4px solid #d84315; }
    .item-info h3 { font-size: 18px; margin-bottom: 4px; }
    .item-info p { font-size: 13px; color: #795548; }
    .price { font-weight: 900; color: #d84315; font-size: 18px; }
    .contact { text-align: center; padding: 30px 20px; background: #fff; margin-top: 20px; border-top: 1px solid #eee; }
    .btn { display: inline-block; background: #25D366; color: #fff; text-decoration: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; margin-top: 15px; box-shadow: 0 4px 10px rgba(37,211,102,0.3); }
  </style>
</head>
<body>

  <div class="header">
    <h1>كافيه الأصيل ☕</h1>
    <p>أحلى قهوة وأجمل قعدة في مصر</p>
  </div>

  <div class="menu-section">
    <h2>المنيو</h2>
    
    <div class="item">
      <div class="item-info">
        <h3>قهوة تركي</h3>
        <p>قهوة غامقة بطعم أصيل</p>
      </div>
      <div class="price">30 ج.م</div>
    </div>

    <div class="item">
      <div class="item-info">
        <h3>لاتيه بارد</h3>
        <p>حليب مع إسبريسو وثلج</p>
      </div>
      <div class="price">55 ج.م</div>
    </div>

    <div class="item">
      <div class="item-info">
        <h3>كرواسون بالشوكولاتة</h3>
        <p>مخبوز طازج كل يوم</p>
      </div>
      <div class="price">40 ج.م</div>
    </div>
  </div>

  <div class="contact">
    <h3>عايز تحجز طاولة؟</h3>
    <p>كلمنا على واتساب</p>
    <!-- حط رقمك هنا كمان عشان تجرب -->
    <a href="https://wa.me/201119125487" class="btn">اطلب دلوقتي</a>
  </div>

</body>
</html>
